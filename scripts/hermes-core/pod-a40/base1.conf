# Base, step 1 (from 14.11.2026): the pass-1 checkpoint on the wide mix, 3.0 B tokens
# (366 000 steps of B8 x T1024), one warmup + cosine schedule, a stage every 4000 steps.
# Weights are shares of the sampled tokens; in brackets, passes over the shard in this run.
# From step 176200 (remix.sh, 15.11.2026): the lookup traces as from a ranked router with the need said
# before the choice (b_lookup5 in place of b_lookup), and the Qwen3.8-27B training data (teacher answers,
# dialogues, code: 0.02 taken from en and b_magpie).
# From step 212200 (16.11.2026): the same traces plus conversations where the model saves a note for a command
# the store lacks (b_lookup6 in place of b_lookup5).
# From step 268200 (16.11.2026): the same traces over tasks with single commands in the wording of a
# pipeline and pipelines in more wordings (b_lookup7 in place of b_lookup6; its held-out part equals
# that of b_lookup6, so the held-out shard stays).
NAME=base1
START=/root/hc/run/pass1.ckpt
ORIGIN=60200
STEPS=426200
STAGE=4000
WARMUP=1000
LR=1e-4
SEED=31
SHARDS=(
  en.u16:0.07 ru.u16:0.06 code.u16:0.02 math.u16:0.015                               # general text the 56M was raised on (retention)
  se.u16:0.07 docs.u16:0.03 b_hermes_code.u16:0.04 b_harness_code.u16:0.07          # domain: Stack Exchange, OS docs, Hermes, harness sources
  b_ultrachat.u16:0.05 b_magpie.u16:0.06 b_chat_misc.u16:0.03 b_ot_answers.u16:0.03 # English dialogue and instructions
  b_multilingual.u16:0.04 b_multilingual_think.u16:0.05                             # eight languages, Russian among them
  b_ot_think.u16:0.03 b_think_misc.u16:0.035                                        # reasoning traces
  b_toolmind.u16:0.08 b_toucan.u16:0.08 b_nemotron.u16:0.045 b_tools_misc.u16:0.035 # tool use in the Hermes function-calling contract
  b_lookup7.u16:0.04                                                                # the model's own reference lookup in the reasoning loop, with notes
  b_q27_answers.u16:0.006 b_q27_chat.u16:0.007 b_q27_code.u16:0.007                 # Qwen3.8-27B answers to coding prompts [5.8], oasst dialogues and code turns [2.9], code [3.0]
)
VAL=rawval.u16
VALS=(hermes=val_hermes.u16 docs=val_docs.u16 se=val_se.u16 chat=bv_chat.u16 multilingual=bv_multilingual.u16
      think=bv_think.u16 tools=bv_tools.u16 lookup=bv_lookup.u16 harness=bv_harness.u16
      lookup5=bv_lookup5.u16 q27=bv_q27.u16 lookup6=bv_lookup6.u16)
