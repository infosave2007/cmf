name: CI

# Documentation never builds: a change confined to `docs/**` or to `*.md`
# files does not start this workflow (the author check in authors.yml still
# runs). The exceptions are the Markdown files the test suite reads as
# corpora — a change there is a change to the tests. The order matters: a
# later pattern overrides an earlier one.
on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md'
      - 'docs/CMF_V2_SPEC.md'
      - 'docs/SKILLS.md'
      - 'docs/SKILLS.ru.md'
      - 'docs/COMPARISON.md'
      - 'docs/decision/hf/API.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md'
      - 'docs/CMF_V2_SPEC.md'
      - 'docs/SKILLS.md'
      - 'docs/SKILLS.ru.md'
      - 'docs/COMPARISON.md'
      - 'docs/decision/hf/API.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace --verbose
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast --verbose

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + clippy)
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
      # Fails only on clippy's deny-by-default (correctness) lints;
      # style warnings are advisory and do not fail the run.
      - run: cargo clippy --locked --workspace --all-targets

  embryo-vulkan:
    name: embryo trainer (Vulkan feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      # No crate enables `cortiq-embryo/vulkan`, so the workspace jobs never
      # compile the Vulkan trainer or its tests. Check them here (no GPU on
      # the runner: compile only).
      - run: cargo check --locked -p cortiq-embryo --features vulkan --all-targets

  msrv:
    name: CLI MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p cortiq-cli
