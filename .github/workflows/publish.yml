# Publish the workspace crates to crates.io in dependency order.
# Manual trigger: Actions → "publish crates" → Run workflow.
# Each `cargo publish` is tolerant of the version already existing on the
# registry, so re-runs after a partial publish are safe.
name: publish crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Publish each crate in dependency order. `cargo publish` packages the
      # crate before upload, so a separate workspace-wide `cargo package`
      # preflight is invalid for a new version: dependent crates would be
      # resolved against crates.io before their newly-versioned dependencies
      # have been published. The bounded retry is only for that registry-index
      # propagation window; all other errors stop the workflow immediately.
      - name: Publish (core → engine → decision → net → server → cli → ffi)
        shell: bash
        run: |
          set -euo pipefail
          crates=(cortiq-core cortiq-engine cortiq-decision cortiq-net cortiq-server cortiq-cli cortiq-ffi)

          publish_crate() {
            local crate="$1"
            local attempt err_log
            err_log="$(mktemp)"
            for attempt in $(seq 1 20); do
              echo "── publishing $crate (attempt $attempt/20) ──"
              if cargo publish --locked -p "$crate" 2>"$err_log"; then
                rm -f "$err_log"
                echo "$crate published"
                return 0
              elif grep -qiE "already (exists|uploaded)|crate version .* is already" "$err_log"; then
                rm -f "$err_log"
                echo "$crate: version already on crates.io — skipping"
                return 0
              elif grep -qiE "no matching package named|failed to select a version for requirement" "$err_log" && [[ "$attempt" -lt 20 ]]; then
                cat "$err_log"
                echo "Waiting for preceding crate metadata to reach crates.io…"
                sleep 15
              else
                cat "$err_log"
                rm -f "$err_log"
                return 1
              fi
            done
            rm -f "$err_log"
            return 1
          }

          for crate in "${crates[@]}"; do
            publish_crate "$crate"
          done
