# Publish the workspace crates to crates.io in dependency order.
# Manual trigger: Actions → "publish crates" → Run workflow.
# Each `cargo publish` is tolerant of the version already existing on the
# registry, so re-runs after a partial publish are safe.
name: publish crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ORDER IS THE DEPENDENCY ORDER, and `cortiq-net` was missing from
      # it. It sits between the engine and the server — both the server
      # and the cli depend on it — so every run since it was introduced
      # died at `cortiq-server` with "no matching package named
      # cortiq-net", and the registry sat at 0.5.65 through three
      # releases while the tags kept moving. Nothing said so: the loop
      # exits non-zero, but a manual workflow nobody re-reads is a
      # silent failure.
      - name: Publish (core → engine → net → server → cli → ffi)
        run: |
          set -e
          for c in cortiq-core cortiq-engine cortiq-net cortiq-server cortiq-cli cortiq-ffi; do
            echo "── publishing $c ──"
            if cargo publish -p "$c" 2>err.log; then
              echo "$c published"
            elif grep -qiE "already (exists|uploaded)|crate version .* is already" err.log; then
              echo "$c: version already on crates.io — skipping"
            else
              cat err.log
              exit 1
            fi
          done
