[package]
name = "cortiq-server"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible HTTP serving for CMF models, built on the cortiq inference engine."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
cortiq-core = { path = "../cortiq-core", version = "0.8.1" }
cortiq-engine = { path = "../cortiq-engine", version = "0.8.1" }
cortiq-net = { path = "../cortiq-net", version = "0.8.1" }
# Decision runtime (encoder, resonance skills, oracle cascade): the
# `decision.cmf` files served next to the language models.
cortiq-decision = { path = "../cortiq-decision", version = "0.8.1" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"

[dev-dependencies]
# The decisions API tests drive the router in-process (`oneshot`) and give
# each case its own state directory.
tower = { workspace = true, features = ["util"] }
tempfile = "3"

[features]
decision-vulkan = ["cortiq-decision/vulkan"]
