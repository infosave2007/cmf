[package]
name = "cortiq-decision"
version.workspace = true
edition.workspace = true
description = "Cortiq Decision: typed decisions (choice, score, yes/no) from one CMF file — a native BERT encoder, a hashing contract and certified resonance skills, an OpenRouter-shaped decisions API and an opt-in oracle cascade."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["cmf", "classification", "decisions", "embeddings", "router"]
categories = ["science"]
rust-version.workspace = true

# Every dependency below was already in the workspace Cargo.lock before this
# crate existed: it adds no package to the tree (spec decision-v4 §0). No GPU
# backend is linked in on its behalf — the encoder runs on
# `cortiq_engine::fcd_ops::gemm_nt_host`.
[dependencies]
cortiq-core = { path = "../cortiq-core", version = "0.7.8" }
cortiq-engine = { path = "../cortiq-engine", version = "0.7.8" }
serde = { workspace = true }
# Canonical JSON and the Jev criteria order need insertion-ordered maps.
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Tensor, manifest and key hashes.
sha2 = "0.10"
# Constant-time API key comparison.
subtle = "2.6"
# Oracle client (OpenRouter, rustls) — the same ureq the engine and cli use.
ureq = { version = "2", features = ["json", "tls"] }
# NFD for the WordPiece normalizer (strip accents).
unicode-normalization = { workspace = true }
parking_lot = "0.12"
crc32fast = "1"
# API keys from the OS RNG.
rand_core = { version = "0.6", features = ["getrandom"] }
bytemuck = "1"
# Writes go to a temp file, fsync, then `persist_noclobber`: an existing
# output is never overwritten.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
