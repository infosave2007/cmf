[package]
name = "cortiq-decision"
version.workspace = true
edition.workspace = true
description = "Cortiq Decision: typed decisions (choice, score, yes/no) from one CMF file — a native BERT encoder, a hashing contract and certified resonance skills, an OpenRouter-shaped decisions API and an opt-in oracle cascade."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["cmf", "classification", "decisions", "embeddings", "router"]
categories = ["science"]
rust-version.workspace = true

# CPU remains the runtime default; Metal and Vulkan require explicit selection.
[dependencies]
cortiq-core = { path = "../cortiq-core", version = "0.8.12" }
cortiq-engine = { path = "../cortiq-engine", version = "0.8.12" }
serde = { workspace = true }
# Canonical JSON and the Jev criteria order need insertion-ordered maps.
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Tensor, manifest and key hashes.
sha2 = "0.10"
# Constant-time API key comparison.
subtle = "2.6"
# Oracle client (OpenRouter, rustls) — the same ureq the engine and cli use.
ureq = { version = "2", features = ["json", "tls"] }
# NFD for the WordPiece normalizer (strip accents).
unicode-normalization = { workspace = true }
parking_lot = "0.12"
crc32fast = "1"
# API keys from the OS RNG.
rand_core = { version = "0.6", features = ["getrandom"] }
bytemuck = "1"

# flock(2) of the state directory's LOCK (already in the tree: cortiq-core).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optional native Vulkan path; CPU/Metal builds do not load a Vulkan device.
[features]
vulkan = ["dep:wgpu", "dep:pollster"]

[dependencies.wgpu]
version = "30"
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

# `tempfile` is test-only (spec decision-v4 §0: "tempfile (dev)"); before this
# crate it was only a dev-dependency of cortiq-spectra, so a runtime entry here would
# pull it into the published cortiq-server / cortiq-cli trees. The no-clobber
# writer (spec §3.1) uses std: a `create_new` temp file in the output's
# directory, `sync_all`, then `std::fs::hard_link(tmp, out)` (fails with
# AlreadyExists instead of overwriting) and removal of the temp name.
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
