[package]
name = "cortiq-spectra"
version.workspace = true
edition.workspace = true
description = "Cortiq Spectra deterministic streaming dual-energy X-ray colorizer"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["xray", "streaming", "spectra", "imaging"]
categories = ["science", "multimedia::images"]
rust-version.workspace = true
publish = false

[lib]
name = "cortiq_spectra"
path = "src/lib.rs"

[[bin]]
name = "cortiq-spectra"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cortiq-core = { path = "../cortiq-core", version = "0.6.4" }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
