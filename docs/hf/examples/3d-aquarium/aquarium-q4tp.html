<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clownfish Aquarium — Interactive 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#eaf6ff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .overlay{position:fixed;pointer-events:none;z-index:10}
  #title{top:26px;left:30px;max-width:62vw}
  #title h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;
    font-size:clamp(26px,4.4vw,52px);letter-spacing:.5px;line-height:1;
    text-shadow:0 2px 24px rgba(0,0,0,.55)}
  #title h1 em{font-style:italic;font-weight:400;color:#ffb27a}
  #title p{margin-top:10px;font-size:clamp(11px,1.3vw,14px);letter-spacing:3px;
    text-transform:uppercase;color:#8fc3e8;opacity:.85}
  #hint{bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;
    letter-spacing:1.5px;color:#bfe3ff;opacity:.72;text-align:center;
    text-shadow:0 1px 10px rgba(0,0,0,.6)}
  #hint b{color:#ffd9a8;font-weight:600}
  #vignette{inset:0;background:radial-gradient(ellipse at 50% 42%,
    transparent 52%,rgba(3,10,20,.6) 100%)}
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(circle at 50% 40%,#123a5e,#0a1628);
    transition:opacity .8s ease}
  #loader.hide{opacity:0;pointer-events:none}
  .ring{width:46px;height:46px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:#ffb27a;
    animation:spin 1s linear infinite}
  #loader span{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#8fc3e8}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette" class="overlay"></div>
<div id="title" class="overlay">
  <h1>Clownfish <em>Aquarium</em></h1>
  <p>Amphiprion ocellaris · procedural 3D</p>
</div>
<div id="hint" class="overlay"><b>Drag</b> to orbit &nbsp;·&nbsp; <b>Scroll</b> to zoom &nbsp;·&nbsp; <b>Right-drag</b> to pan</div>
<div id="loader"><div class="ring"></div><span>Filling the tank…</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Renderer / Scene / Camera ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1628, 0.02);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6.5, 4.2, 9.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.5, 0);
controls.minDistance = 4;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.92;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', () => controls.autoRotate = false);

/* ---------- Tank dimensions ---------- */
const TANK = { w:6, d:4, h:3, t:0.08 };
const waterH = 2.7;
const B = { x:TANK.w/2, y:waterH, z:TANK.d/2 };
const M = 0.35; // fish margin from walls

/* ---------- Lighting ---------- */
scene.add(new THREE.AmbientLight(0xb3e5fc, 0.4));
scene.add(new THREE.HemisphereLight(0xbfe9ff, 0x0a1628, 0.35));

const dir = new THREE.DirectionalLight(0xfff8e1, 1.0);
dir.position.set(5, 11, 6);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 1; dir.shadow.camera.far = 40;
dir.shadow.camera.left = -8; dir.shadow.camera.right = 8;
dir.shadow.camera.top = 8; dir.shadow.camera.bottom = -8;
dir.shadow.bias = -0.0004; dir.shadow.normalBias = 0.02;
scene.add(dir);

const lamp = new THREE.PointLight(0xffe0b2, 0.8, 14, 2);
lamp.position.set(0, 2.9, 0);
scene.add(lamp);

const fill = new THREE.PointLight(0x66b3ff, 0.35, 12, 2);
fill.position.set(-3, 1.2, 3);
scene.add(fill);

/* ---------- Background gradient + animated caustics ---------- */
const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms:{ uTime:{value:0} },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    varying vec3 vP; uniform float uTime;
    void main(){
      vec3 d=normalize(vP);
      float t=clamp(d.y*0.5+0.5,0.0,1.0);
      vec3 col=mix(vec3(0.039,0.086,0.157), vec3(0.102,0.227,0.361), pow(t,0.85));
      float c=0.0;
      for(int i=0;i<3;i++){
        float fi=float(i);
        vec2 p=d.xy*3.0+vec2(uTime*0.05*(fi+1.0), sin(uTime*0.15+fi)*0.4);
        c+=sin(p.x*2.0+sin(p.y*1.7+uTime*0.2))*cos(p.y*2.3+cos(p.x*1.3-uTime*0.15));
      }
      c=c/3.0;
      float caust=smoothstep(0.55,1.0,c)*0.10;
      col+=vec3(0.35,0.6,0.85)*caust;
      gl_FragColor=vec4(col,1.0);
    }`
});
const bg = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), bgMat);
bg.frustumCulled = false;
scene.add(bg);

/* ---------- Floor + caustic pool ---------- */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x0a1626, roughness:0.95, metalness:0.0 })
);
floor.rotation.x = -Math.PI/2; floor.position.y = -0.001; floor.receiveShadow = true;
scene.add(floor);

const causticMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    varying vec2 vUv; uniform float uTime;
    void main(){
      vec2 uv=vUv*6.0; float t=uTime*0.35; float c=0.0;
      for(int i=0;i<3;i++){ float fi=float(i);
        vec2 p=uv+vec2(sin(t+fi*1.3),cos(t*0.8+fi))*0.6;
        c+=sin(p.x*1.5+sin(p.y*1.2+t))*cos(p.y*1.5+cos(p.x*1.1-t)); }
      c=c/3.0;
      float v=smoothstep(0.35,1.0,c);
      float edge=smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x)*smoothstep(0.0,0.18,vUv.y)*smoothstep(1.0,0.82,vUv.y);
      gl_FragColor=vec4(vec3(0.35,0.7,0.95)*v*edge*0.5, v*edge*0.5);
    }`
});
const caustic = new THREE.Mesh(new THREE.PlaneGeometry(TANK.w*1.15, TANK.d*1.15), causticMat);
caustic.rotation.x = -Math.PI/2; caustic.position.y = 0.02;
scene.add(caustic);

/* ---------- Glass tank (5 panels) + frame ---------- */
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xe0f7fa, metalness:0, roughness:0.05, transmission:0.95,
  thickness:0.15, ior:1.5, transparent:true, opacity:0.18,
  clearcoat:1.0, clearcoatRoughness:0.05, envMapIntensity:1.0,
  side:THREE.DoubleSide, depthWrite:false
});
function panel(w,h,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), glassMat);
  m.position.set(x,y,z); m.renderOrder = 2; return m;
}
const tank = new THREE.Group();
tank.add(panel(TANK.w, TANK.h, TANK.t, 0, TANK.h/2,  TANK.d/2));
tank.add(panel(TANK.w, TANK.h, TANK.t, 0, TANK.h/2, -TANK.d/2));
tank.add(panel(TANK.t, TANK.h, TANK.d,  TANK.w/2, TANK.h/2, 0));
tank.add(panel(TANK.t, TANK.h, TANK.d, -TANK.w/2, TANK.h/2, 0));
tank.add(panel(TANK.w, TANK.t, TANK.d, 0, TANK.t/2, 0));
scene.add(tank);

const frameMat = new THREE.MeshStandardMaterial({ color:0x14181d, roughness:0.55, metalness:0.35 });
function bar(w,h,d,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),frameMat); m.position.set(x,y,z); m.castShadow=true; return m; }
const fw = TANK.w + 0.16, fd = TANK.d + 0.16, fh = 0.16, fy = TANK.h + 0.02;
const frame = new THREE.Group();
frame.add(bar(fw, fh, 0.16, 0, fy,  fd/2));
frame.add(bar(fw, fh, 0.16, 0, fy, -fd/2));
frame.add(bar(0.16, fh, fd,  fw/2, fy, 0));
frame.add(bar(0.16, fh, fd, -fw/2, fy, 0));
scene.add(frame);

/* ---------- Water volume + animated surface ---------- */
const waterMat = new THREE.MeshPhysicalMaterial({
  color:0x1e88e5, transparent:true, opacity:0.16, roughness:0.15,
  metalness:0, transmission:0.6, thickness:1.2, ior:1.33,
  side:THREE.DoubleSide, depthWrite:false
});
const water = new THREE.Mesh(new THREE.BoxGeometry(TANK.w-0.16, waterH, TANK.d-0.16), waterMat);
water.position.y = waterH/2; water.renderOrder = 1;
scene.add(water);

const surfMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  uniforms:{ uTime:{value:0}, uColor:{value:new THREE.Color(0x66c2ff)} },
  vertexShader:`
    uniform float uTime; varying float vH;
    void main(){
      vec3 p=position;
      float w=sin(p.x*3.0+uTime*1.5)*0.02 + sin(p.y*4.0+uTime*1.1)*0.02 + sin((p.x+p.y)*2.0+uTime*0.8)*0.015;
      p.z+=w; vH=w;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform vec3 uColor; varying float vH;
    void main(){ float a=0.10+smoothstep(0.0,0.04,vH)*0.35; gl_FragColor=vec4(uColor,a); }`
});
const surface = new THREE.Mesh(new THREE.PlaneGeometry(TANK.w-0.16, TANK.d-0.16, 40, 40), surfMat);
surface.rotation.x = -Math.PI/2; surface.position.y = waterH; surface.renderOrder = 1;
scene.add(surface);

/* ---------- Gravel bed + stones ---------- */
const stoneCols = [0x8D6E63,0xA1887F,0x9E9E9E,0x6D4C41,0x757575,0x8D6E63];
const gravel = new THREE.Mesh(
  new THREE.BoxGeometry(TANK.w-0.16, 0.12, TANK.d-0.16),
  new THREE.MeshStandardMaterial({ color:0x6d5a4a, roughness:1 })
);
gravel.position.y = 0.06; gravel.receiveShadow = true;
scene.add(gravel);

for (let i=0;i<22;i++){
  const r = 0.06 + Math.random()*0.16;
  const geo = Math.random()<0.5 ? new THREE.DodecahedronGeometry(r,0) : new THREE.SphereGeometry(r,8,6);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: stoneCols[(Math.random()*stoneCols.length)|0], roughness:0.9, metalness:0.05 }));
  m.position.set((Math.random()-0.5)*(TANK.w-0.7), 0.12+r*0.5, (Math.random()-0.5)*(TANK.d-0.7));
  m.scale.y = 0.55 + Math.random()*0.3;
  m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}

/* ---------- Aquatic plants (swaying blades) ---------- */
const plantCols = [0x2E7D32,0x388E3C,0x1B5E20,0x4CAF50];
const plantMats = plantCols.map(c => new THREE.MeshStandardMaterial({
  color:c, roughness:0.7, metalness:0, side:THREE.DoubleSide,
  emissive:new THREE.Color(c).multiplyScalar(0.12) }));
const plants = [];
function makeBlade(h, w, mat){
  const s = new THREE.Shape();
  s.moveTo(-w/2,0); s.quadraticCurveTo(-w*0.35,h*0.5,0,h);
  s.quadraticCurveTo(w*0.35,h*0.5,w/2,0); s.lineTo(-w/2,0);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s, 12), mat);
  m.castShadow = true; return m;
}
function makePlant(x,z){
  const g = new THREE.Group(); g.position.set(x,0.1,z);
  const n = 4 + (Math.random()*4|0);
  for (let i=0;i<n;i++){
    const h = 0.7 + Math.random()*1.1, w = 0.12 + Math.random()*0.1;
    const b = makeBlade(h, w, plantMats[(Math.random()*plantMats.length)|0]);
    b.position.set((Math.random()-0.5)*0.3, 0, (Math.random()-0.5)*0.3);
    b.rotation.y = Math.random()*Math.PI*2;
    b.userData = { phase:Math.random()*Math.PI*2, amp:0.06+Math.random()*0.08, speed:0.6+Math.random()*0.5 };
    g.add(b); plants.push(b);
  }
  scene.add(g);
}
makePlant(-2.2,-1.3); makePlant(2.2,-1.3); makePlant(-2.4,1.2); makePlant(2.3,1.1); makePlant(0,-1.5);

/* ---------- Bubbles ---------- */
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.05, transmission:1.0,
  thickness:0.2, ior:1.1, transparent:true, opacity:0.5, iridescence:0.6, iridescenceIOR:1.3
});
const bubbleGeo = new THREE.SphereGeometry(1, 12, 10);
const bubbles = [];
const streams = [ {x:-1.6,z:-0.8}, {x:1.7,z:0.9} ];
function spawnBubble(s){
  const r = 0.02 + Math.random()*0.045;
  const m = new THREE.Mesh(bubbleGeo, bubbleMat);
  m.scale.setScalar(r);
  m.position.set(s.x+(Math.random()-0.5)*0.15, 0.15, s.z+(Math.random()-0.5)*0.15);
  m.userData = { r, speed:0.4+Math.random()*0.5, phase:Math.random()*Math.PI*2, wob:0.03+Math.random()*0.05 };
  scene.add(m); bubbles.push(m);
}
let spawnAcc = 0;

/* ---------- Clownfish ---------- */
const fishMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uOrange:{value:new THREE.Color(0xFF6D00)},
    uBelly:{value:new THREE.Color(0xFFB066)},
    uWhite:{value:new THREE.Color(0xF7F3EA)},
    uBlack:{value:new THREE.Color(0x0a0a0a)}
  },
  vertexShader:`
    varying vec3 vN; varying vec3 vP; varying vec3 vW;
    void main(){
      vN=normalize(normalMatrix*normal);
      vP=position;
      vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }`,
  fragmentShader:`
    uniform float uTime; uniform vec3 uOrange,uBelly,uWhite,uBlack;
    varying vec3 vN; varying vec3 vP; varying vec3 vW;
    void main(){
      vec3 N=normalize(vN);
      float stripe=0.0;
      float d1=abs(vP.z-0.55), d2=abs(vP.z+0.05), d3=abs(vP.z+0.62);
      float w1=0.10, w2=0.13, w3=0.09;
      float b1=0.035, b2=0.045, b3=0.03;
      if(d1<w1||d2<w2||d3<w3) stripe=1.0;
      else if(d1<w1+b1||d2<w2+b2||d3<w3+b3) stripe=2.0;
      vec3 col=mix(uOrange,uBelly,smoothstep(0.0,-0.35,vP.y));
      if(stripe>0.5) col=mix(col,uWhite,0.92);
      if(stripe>1.5) col=mix(col,uBlack,0.9);
      vec3 V=normalize(cameraPosition-vW);
      float fres=pow(1.0-max(dot(N,V),0.0),3.0);
      float diff=max(dot(N,normalize(vec3(0.4,0.8,0.5))),0.0);
      float spec=pow(max(dot(N,normalize(vec3(0.4,0.8,0.5))),0.0),24.0);
      vec3 c=col*(0.45+0.75*diff)+spec*0.5+fres*vec3(0.25,0.4,0.55);
      gl_FragColor=vec4(c,1.0);
    }`
});
const finMat = new THREE.MeshStandardMaterial({
  color:0xFF7A1A, roughness:0.5, metalness:0, side:THREE.DoubleSide,
  transparent:true, opacity:0.9, emissive:0x3a1400, emissiveIntensity:0.3 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color:0xf5f5f5, roughness:0.3 });
const pupilMat = new THREE.MeshStandardMaterial({ color:0x050505, roughness:0.15 });
const glossMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:0.6 });
const mouthMat = new THREE.MeshStandardMaterial({ color:0x3a1400, roughness:0.6 });

function makeFish(scale){
  const root = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 40, 28), fishMat);
  body.scale.set(0.55, 0.85, 1.6); body.castShadow = true;
  root.add(body);

  // tail (wags)
  const tail = new THREE.Group(); tail.position.set(0, 0, -0.78);
  const ts = new THREE.Shape();
  ts.moveTo(0,0); ts.quadraticCurveTo(-0.12,0.18,-0.05,0.34);
  ts.lineTo(0.05,0.34); ts.quadraticCurveTo(0.12,0.18,0,0);
  const tailMesh = new THREE.Mesh(new THREE.ShapeGeometry(ts, 16), finMat);
  tailMesh.rotation.y = Math.PI/2; tailMesh.castShadow = true;
  tail.add(tailMesh); root.add(tail);

  // dorsal fin
  const ds = new THREE.Shape();
  ds.moveTo(-0.5,0); ds.quadraticCurveTo(0,0.34,0.5,0); ds.lineTo(-0.5,0);
  const dorsal = new THREE.Mesh(new THREE.ShapeGeometry(ds, 16), finMat);
  dorsal.rotation.y = Math.PI/2; dorsal.position.set(0, 0.4, 0.05); dorsal.castShadow = true;
  root.add(dorsal);

  // anal fin
  const as = new THREE.Shape();
  as.moveTo(-0.2,0); as.quadraticCurveTo(0,-0.2,0.2,0); as.lineTo(-0.2,0);
  const anal = new THREE.Mesh(new THREE.ShapeGeometry(as, 12), finMat);
  anal.rotation.y = Math.PI/2; anal.position.set(0, -0.35, -0.35);
  root.add(anal);

  // pectoral fins
  const pects = [];
  for (const s of [1,-1]){
    const ps = new THREE.Shape();
    ps.moveTo(0,0); ps.quadraticCurveTo(0.18,-0.05,0.28,-0.18);
    ps.quadraticCurveTo(0.12,-0.02,0,0);
    const p = new THREE.Mesh(new THREE.ShapeGeometry(ps, 12), finMat);
    p.position.set(s*0.28, -0.05, 0.35);
    p.rotation.set(0, s*Math.PI/2, s*0.5);
    p.userData = { base:s*0.5, dir:s };
    root.add(p); pects.push(p);
  }

  // eyes
  for (const s of [1,-1]){
    const e = new THREE.Group(); e.position.set(s*0.24, 0.12, 0.62);
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), eyeWhiteMat);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), pupilMat); p.position.z = 0.07;
    const g = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), glossMat); g.position.set(0.03, 0.03, 0.11);
    e.add(w, p, g); root.add(e);
  }

  // mouth
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), mouthMat);
  mouth.position.set(0, -0.05, 0.8); mouth.scale.set(1, 0.7, 0.5);
  root.add(mouth);

  root.scale.setScalar(scale);
  root.userData = { tail, dorsal, pects };
  return root;
}

const fish = [];
[1.1, 1.0, 0.9].forEach((sc, i) => {
  const root = makeFish(sc);
  root.position.set((Math.random()-0.5)*3, 1.0+Math.random()*1.2, (Math.random()-0.5)*2);
  scene.add(root);
  fish.push({
    root, speed:0.006 + Math.random()*0.008,
    target:new THREE.Vector3((Math.random()-0.5)*3, 1.0+Math.random()*1.2, (Math.random()-0.5)*2),
    vel:new THREE.Vector3(), phase:Math.random()*10, bank:0,
    tailAmp:0.35 + Math.random()*0.15, tailSpeed:6 + Math.random()*3
  });
});

/* ---------- Animation loop ---------- */
const clock = new THREE.Clock();
const _dir = new THREE.Vector3(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4();
const _up = new THREE.Vector3(0,1,0), _fwd = new THREE.Vector3(0,0,1);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  bgMat.uniforms.uTime.value = t;
  causticMat.uniforms.uTime.value = t;
  surfMat.uniforms.uTime.value = t;
  fishMat.uniforms.uTime.value = t;

  // plants sway
  for (const b of plants){
    const u = b.userData;
    b.rotation.z = Math.sin(t*u.speed + u.phase) * u.amp;
    b.rotation.x = Math.cos(t*u.speed*0.8 + u.phase) * u.amp * 0.5;
  }

  // bubbles
  spawnAcc += dt;
  const rate = 1/3;
  while (spawnAcc > rate){ spawnAcc -= rate; spawnBubble(streams[(Math.random()*streams.length)|0]); }
  for (let i=bubbles.length-1;i>=0;i--){
    const b = bubbles[i], u = b.userData;
    b.position.y += u.speed*dt;
    b.position.x += Math.sin(t*3 + u.phase)*u.wob*dt;
    b.position.z += Math.cos(t*2.5 + u.phase)*u.wob*dt;
    const prog = b.position.y/waterH;
    b.scale.setScalar(u.r*(1 - prog*0.35));
    if (b.position.y > waterH - 0.05){ scene.remove(b); bubbles.splice(i,1); }
  }

  // fish
  for (const f of fish){
    const r = f.root;
    const to = f.target.clone().sub(r.position);
    if (to.length() < 0.4){
      f.target.set((Math.random()-0.5)*(TANK.w-2*M), 0.6+Math.random()*(waterH-2*M), (Math.random()-0.5)*(TANK.d-2*M));
    }
    to.normalize();
    f.vel.lerp(to.multiplyScalar(f.speed), 0.04);
    r.position.add(f.vel);
    // clamp inside tank
    r.position.x = THREE.MathUtils.clamp(r.position.x, -B.x+M, B.x-M);
    r.position.y = THREE.MathUtils.clamp(r.position.y, 0.4, B.y-M);
    r.position.z = THREE.MathUtils.clamp(r.position.z, -B.z+M, B.z-M);

    const sp = f.vel.length();
    if (sp > 1e-4){
      _dir.copy(f.vel).normalize();
      _m.lookAt(_dir, _up, _fwd);
      _q.setFromRotationMatrix(_m);
      r.quaternion.slerp(_q, 0.08);
    }
    // banking on turns
    const right = new THREE.Vector3(1,0,0).applyQuaternion(r.quaternion);
    const turn = _dir.dot(right);
    f.bank += ((-turn*0.5) - f.bank) * 0.05;
    r.rotateZ(f.bank);

    // fins
    const wag = Math.sin(t*f.tailSpeed + f.phase);
    r.userData.tail.rotation.y = wag * f.tailAmp;
    r.userData.dorsal.rotation.z = Math.sin(t*3 + f.phase)*0.06;
    for (const p of r.userData.pect){
      p.rotation.z = p.userData.base + Math.sin(t*8 + f.phase)*0.3*p.userData.dir;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------- Resize ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- Loader fade ---------- */
setTimeout(() => document.getElementById('loader').classList.add('hide'), 700);
</script>
</body>
</html>
